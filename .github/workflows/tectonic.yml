name: 'Build CV and Create Releases'
on: 
  push:
    branches: ['**']     # Build all branches
    tags: ['v*']
  pull_request:
    branches: ['**']     # Build all pull requests

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pdf-name: ${{ steps.metadata.outputs.pdf-name }}
      commit-hash: ${{ steps.metadata.outputs.commit-hash }}
      build-date: ${{ steps.metadata.outputs.build-date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Roboto fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-roboto
          fc-cache -fv
          echo "✅ Installed Roboto fonts:"
          fc-list | grep -i roboto | head -5

      - name: Install biber
        run: |
          sudo apt-get update
          sudo apt-get install -y biber
          fc-cache -fv
          echo "✅ Installed biber"
        
      - name: Generate build metadata
        id: metadata
        run: |
          echo "commit-hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build-date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "pdf-name=cv-$(date -u '+%Y%m%d-%H%M%S').pdf" >> $GITHUB_OUTPUT
          
      - uses: actions/cache@v4
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex', '**/*.bib') }}
          restore-keys: |
           ${{ runner.os }}-tectonic-
           
      - uses: wtfjoke/setup-tectonic@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build CV with Tectonic
        working-directory: src/
        run: |
          echo "Building CV..."
          tectonic cv.tex
          echo "Build completed successfully"
          
      - name: Validate PDF output
        working-directory: src/
        run: |
          if [ ! -f cv.pdf ]; then
            echo "Error: cv.pdf was not generated"
            exit 1
          fi
          
          pdf_size=$(stat -f%z cv.pdf 2>/dev/null || stat -c%s cv.pdf)
          if [ $pdf_size -lt 50000 ]; then
            echo "Error: PDF file seems too small ($pdf_size bytes)"
            exit 1
          fi
          
          echo "✅ PDF validation successful (size: $pdf_size bytes)"
          
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp src/cv.pdf artifacts/cv.pdf
          cp src/cv.pdf "artifacts/${{ steps.metadata.outputs.pdf-name }}"
          echo "Build completed: ${{ steps.metadata.outputs.build-date }}" > artifacts/build-info.txt
          echo "Commit: ${{ steps.metadata.outputs.commit-hash }}" >> artifacts/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> artifacts/build-info.txt
          echo "Event: ${{ github.event_name }}" >> artifacts/build-info.txt
          
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf-${{ github.ref_name }}-${{ steps.metadata.outputs.commit-hash }}
          path: artifacts/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || (github.event_name == 'pull_request' && 3 || 7) }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf-${{ github.ref_name }}-${{ needs.build.outputs.commit-hash }}
          path: artifacts/
          
      - name: Create pre-release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}-${{ needs.build.outputs.commit-hash }}
          name: "CV Build - ${{ needs.build.outputs.build-date }} (commit: ${{ needs.build.outputs.commit-hash }})"
          prerelease: true
          body: |
            📝 **Automated CV build from main branch**
            
            🗓️ **Built:** ${{ needs.build.outputs.build-date }}
            📝 **Commit:** ${{ needs.build.outputs.commit-hash }} - "${{ github.event.head_commit.message }}"
            🌿 **Branch:** main
            👤 **Author:** ${{ github.event.head_commit.author.name }}
            
            This is an automated pre-release generated from the latest main branch commit.
          files: |
            artifacts/cv.pdf
            artifacts/build-info.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create official release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: "Version ${{ github.ref_name }} - ${{ needs.build.outputs.build-date }}"
          body: |
            📄 **Official CV Release ${{ github.ref_name }}**
            
            🗓️ **Released:** ${{ needs.build.outputs.build-date }}
            📝 **Based on commit:** ${{ needs.build.outputs.commit-hash }}
            
            ### Download
            - **PDF:** Alvaro Segura Del Barco - CV ${{ github.ref_name }}
            
            This is an official release of the CV with all latest updates and improvements.
          files: |
            artifacts/cv.pdf
            artifacts/build-info.txt
          token: ${{ secrets.GITHUB_TOKEN }}
